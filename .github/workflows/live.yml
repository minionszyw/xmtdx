name: Live protocol validation

on:
  workflow_dispatch:
    inputs:
      full_list:
        description: Scan the complete SH/SZ A-share list
        required: false
        default: false
        type: boolean

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run live validator
        run: python scripts/validate_live.py --json ${{ inputs.full_list && '--full-list' || '' }}
