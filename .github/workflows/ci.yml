name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pandas]" build
      - run: python -m pytest tests/unit --cov=xmtdx --cov-report=term-missing --cov-fail-under=70
      - run: python -m mypy src
      - run: python -m ruff check .
      - run: python -m build

  coverage-target:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,pandas]"
      - run: python -m pytest tests/unit --cov=xmtdx --cov-report=term-missing --cov-fail-under=90
